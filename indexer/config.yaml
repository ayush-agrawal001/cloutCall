# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Monad testnet via HyperSync (set ENVIO_API_TOKEN). Addresses come from ../deployments/10143.json.
name: cloutcall-indexer
description: CloutCall leaderboard, streaks, duels and market history on Monad
contracts:
  - name: CloutMarket
    events:
      - event: "MarketCreated(uint256 indexed marketId, address indexed creator, string videoId, uint64 threshold, uint64 baselineViews, uint64 closeTime, uint64 resolveTime)"
      - event: "Called(uint256 indexed marketId, address indexed player, uint8 side, uint256 amount, address indexed rival)"
      - event: "SealedCallCommitted(uint256 indexed marketId, address indexed player, bytes32 commitment, uint256 amount, address indexed rival)"
      - event: "SealedCallRevealed(uint256 indexed marketId, address indexed player, uint8 side, uint256 amount)"
      - event: "Resolved(uint256 indexed marketId, uint64 finalViews, uint8 outcome)"
      - event: "Voided(uint256 indexed marketId)"
      - event: "Claimed(uint256 indexed marketId, address indexed player, uint256 staked, uint256 payout)"
  - name: AgentJournal
    events:
      - event: "AgentPick(uint256 indexed marketId, address indexed agent, uint8 side, uint16 confidenceBps, uint64 predictedViews, string model, string reasoning)"
  - name: CreatorRegistry
    events:
      - event: "CreatorVerified(address indexed creator, string channelId, string channelTitle)"
      - event: "CreatorUnlinked(address indexed creator, string channelId)"
chains:
  - id: ${ENVIO_CHAIN_ID:-10143}
    start_block: ${ENVIO_START_BLOCK:-0}
    contracts:
      - name: CloutMarket
        address: "${ENVIO_MARKET_ADDRESS}"
      - name: AgentJournal
        address: "${ENVIO_JOURNAL_ADDRESS}"
      - name: CreatorRegistry
        address: "${ENVIO_REGISTRY_ADDRESS}"
