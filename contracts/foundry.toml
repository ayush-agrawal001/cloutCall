[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Deploy script writes addresses to ../deployments/<chainId>.json for the web app, resolver and indexer.
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad = "${MONAD_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110
